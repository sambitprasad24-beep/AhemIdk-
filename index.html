<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For GOLUMON💗</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #fff0f7);
      color: #71304f;
      text-align: center;
    }

    nav {
      padding: 18px;
      background: rgba(255, 255, 255, 0.85);
      color: #e6498c;
      font-weight: bold;
      font-size: 20px;
    }

    .page {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .card {
      width: 100%;
      max-width: 750px;
      padding: 40px 25px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 35px;
      box-shadow: 0 15px 45px rgba(216, 91, 150, 0.25);
    }

    h1 {
      font-family: "Pacifico", cursive;
      color: #e6498c;
      font-size: clamp(42px, 8vw, 75px);
      font-weight: normal;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
    }

    .heart {
      font-size: 75px;
      animation: float 2s infinite;
    }

    @keyframes float {
      50% {
        transform: translateY(-12px);
      }
    }

    button {
      padding: 15px 28px;
      margin: 12px;
      border: none;
      border-radius: 30px;
      background: #ed5b9a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(237, 91, 154, 0.3);
    }

    button:hover {
      background: #d92d72;
      transform: translateY(-3px);
    }

    footer {
      padding: 20px;
      color: #a92e66;
    }
  </style>
</head>

<body>

  <nav>
    For My GOLUMON💗
  </nav>

  <main class="page">
    <section class="card">

      <div class="heart">💗</div>

      <h1>Hi GOLUMON💗</h1>

      <p>
        I made a tiny little world for someone very special.
      </p>

      <p>
        Some stories deserve a softer beginning
        and a beautiful second chance.
      </p>

      <button onclick="startStory()">
        Open My Heart →
      </button>

    </section>
  </main>

  <footer>
    Made with care for GOLUMON💗
  </footer>

  <script>
    function startStory() {
      alert("Our story is just beginning 💗");
    }
  </script>

</body>
</html>
