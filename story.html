<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Story 🌷</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Poppins", sans-serif;
      text-align: center;
      color: #71304f;
      background: linear-gradient(135deg, #ffd6e7, #fff0f7);
    }

    nav {
      padding: 18px;
      background: rgba(255, 255, 255, 0.85);
      color: #e6498c;
      font-size: 20px;
      font-weight: bold;
    }

    main {
      padding: 35px 20px;
    }

    .card {
      max-width: 900px;
      margin: auto;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      box-shadow: 0 15px 45px rgba(216, 91, 150, 0.25);
    }

    h1 {
      font-family: "Pacifico", cursive;
      color: #e6498c;
      font-size: clamp(35px, 7vw, 60px);
      font-weight: normal;
    }

    p {
      font-size: 17px;
      line-height: 1.8;
    }

    .memories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .memory {
      padding: 15px;
      border-radius: 20px;
      background: #fff0f7;
      box-shadow: 0 8px 20px rgba(216, 91, 150, 0.12);
    }

    .memory img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 15px;
      background: #ffd0e3;
    }

    .memory input {
      width: 100%;
      font-size: 12px;
    }

    button {
      padding: 14px 25px;
      margin: 10px;
      border: none;
      border-radius: 30px;
      background: #ed5b9a;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #d92d72;
      transform: translateY(-3px);
    }

    .back {
      background: #ffd1e4;
      color: #a92e66;
    }

    footer {
      padding: 20px;
      color: #a92e66;
    }
  </style>
</head>

<body>

  <nav>
    Our Little Story 🌷
  </nav>

  <main>
    <section class="card">

      <h1>Our Little Story 💗</h1>

      <p>
        Some moments are small,
        but they become unforgettable.
      </p>

      <p>
        Add your favorite memories below.
      </p>

      <div class="memories">

        <div class="memory">
          <img id="photo1" alt="Our first memory">

          <p>Our first memory 💗</p>

          <input
            type="file"
            accept="image/*"
            onchange="uploadPhoto(this, 'photo1')">
        </div>

        <div class="memory">
          <img id="photo2" alt="A special moment">

          <p>A special moment 🌸</p>

          <input
            type="file"
            accept="image/*"
            onchange="uploadPhoto(this, 'photo2')">
        </div>

        <div class="memory">
          <img id="photo3" alt="A moment I miss">

          <p>A moment I miss 🥺</p>

          <input
            type="file"
            accept="image/*"
            onchange="uploadPhoto(this, 'photo3')">
        </div>

        <div class="memory">
          <img id="photo4" alt="Our little world">

          <p>Our little world 🎀</p>

          <input
            type="file"
            accept="image/*"
            onchange="uploadPhoto(this, 'photo4')">
        </div>

      </div>

      <button
        class="back"
        onclick="goBack()">
        ← Back
      </button>

      <button
        onclick="goNext()">
        Next Memory →
      </button>

    </section>
  </main>

  <footer>
    Made with care for GOLUMON💗
  </footer>

  <script>
    function uploadPhoto(input, imageId) {
      const image = document.getElementById(imageId);

      if (input.files && input.files[0]) {
        const reader = new FileReader();

        reader.onload = function(event) {
          image.src = event.target.result;
        };

        reader.readAsDataURL(input.files[0]);
      }
    }

    function goBack() {
      window.location.href = "index.html";
    }

    function goNext() {
      window.location.href = "letter.html";
    }
  </script>

</body>
</html>
