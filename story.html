<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 15px;
      min-height: 100vh;
      font-family: "Comic Sans MS", cursive;
      text-align: center;
      background: linear-gradient(135deg, #ffd1e4, #fff2f8);
      color: #7b2850;
    }

    .card {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.93);
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(190, 70, 120, 0.2);
    }

    h1 {
      color: #e75491;
      font-size: 38px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .memory {
      background: #ffe4ef;
      padding: 12px;
      border-radius: 22px;
      box-shadow: 0 5px 15px rgba(190, 70, 120, 0.15);
    }

    .memory img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 16px;
    }

    .memory p {
      color: #a52d61;
      font-size: 17px;
      margin-bottom: 5px;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 13px 23px;
      margin: 20px 8px 0;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      background: #ff8fbd;
      color: white;
      transition: 0.3s;
    }

    button:hover {
      background: #e75491;
      transform: scale(1.05);
    }

    .back {
      background: #c9a0b5;
    }

    .back:hover {
      background: #a77b91;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Our Little Memories 📸💗</h1>

    <p>
      Every memory has a small place in my heart.
      Here are some moments I wanted to keep special. 🌷
    </p>

    <div class="gallery">

      <div class="memory">
        <img src="photo1.jpg" alt="Our first memory">
        <p>Our first memory 💗</p>
      </div>

      <div class="memory">
        <img src="photo2.jpg" alt="A beautiful memory">
        <p>A beautiful moment 🌸</p>
      </div>

      <div class="memory">
        <img src="photo3.jpg" alt="A special memory">
        <p>A special day 💌</p>
      </div>

      <div class="memory">
        <img src="photo4.jpg" alt="A sweet memory">
        <p>A sweet memory 🤍</p>
      </div>

    </div>

    <button class="back" onclick="goBack()">
      ⬅ Back to Home
    </button>

    <button onclick="goNext()">
      Next: Open My Letter 💌
    </button>

  </div>

  <script>
    function goBack() {
      window.location.href = "index.html";
    }

    function goNext() {
      window.location.href = "letter.html";
    }
  </script>

</body>
</html>
